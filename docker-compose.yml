services:
  # =============================================================================
  # Infrastructure
  # =============================================================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aifya-postgres
    environment:
      POSTGRES_DB: aifya
      POSTGRES_USER: aifya_user
      POSTGRES_PASSWORD: change_me_in_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aifya_user -d aifya" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aifya-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: aifya-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:latest
    container_name: aifya-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aifya-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: aifya-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aifya
      KC_DB_USERNAME: aifya_user
      KC_DB_PASSWORD: change_me_in_production
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/aifya-realm.json:/opt/keycloak/data/import/aifya-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # =============================================================================
  # Application Services
  # =============================================================================

  api-gateway:
    image: aifya-api-gateway
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: aifya-api-gateway
    environment:
      SECRET_KEY: "fb7a9c8d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b"
      DATABASE_URL: postgresql+asyncpg://aifya_user:change_me_in_production@postgres:5432/aifya
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      AI_SERVICE_URL: http://ai-service:8010
      VLLM_MEDGEMMA_27B_URL: http://medgemma:8004/v1
      DEFAULT_LICENSE_TIER: professional
      LOCAL_AUTH_BYPASS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api-gateway:/app

  web:
    image: aifya-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_KNOWLEDGE_API_URL: http://localhost:8025/api/v1
        NEXT_PUBLIC_SCRIBE_API_URL: http://localhost:8005
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
        NEXT_PUBLIC_DEFAULT_LICENSE_TIER: professional
    container_name: aifya-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_KNOWLEDGE_API_URL: http://localhost:8025/api/v1
      NEXT_PUBLIC_SCRIBE_API_URL: http://localhost:8005
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      NEXT_PUBLIC_DEFAULT_LICENSE_TIER: professional
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  billing-service:
    image: aifya-billing-service
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: aifya-billing
    environment:
      DATABASE_URL: postgres://aifya_user:change_me_in_production@postgres:5432/aifya
      PORT: "8020"
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy

  knowledge-service:
    image: aifya-knowledge-service
    build:
      context: ./services/ai-service/knowledge
      dockerfile: Dockerfile
    container_name: aifya-knowledge
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://aifya_user:change_me_in_production@postgres:5432/aifya
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: aifya
      LOCAL_AUTH_BYPASS: "true"
      QDRANT_ENDPOINT: http://qdrant:6333
      EMBEDDING_MODEL: local-hash
      EMBEDDING_DIMENSION: "1024"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_KNOWLEDGE_BUCKET: aifya-knowledge
      MINIO_SECURE: "false"
      VLLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gpt-4o-mini}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8025:8025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  knowledge-worker:
    image: aifya-knowledge-worker
    build:
      context: ./services/ai-service/knowledge
      dockerfile: Dockerfile
    container_name: aifya-knowledge-worker
    command: celery -A app.tasks.celery_app worker -l info -Q knowledge -c 2
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://aifya_user:change_me_in_production@postgres:5432/aifya
      QDRANT_ENDPOINT: http://qdrant:6333
      EMBEDDING_MODEL: local-hash
      EMBEDDING_DIMENSION: "1024"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_KNOWLEDGE_BUCKET: aifya-knowledge
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  scribe-service:
    image: aifya-scribe-service
    build:
      context: ./services/ai-service/scribe/backend
      dockerfile: Dockerfile
    container_name: aifya-scribe
    ports:
      - "8005:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://aifya_user:change_me_in_production@postgres:5432/aifya
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_AUDIO_BUCKET: aifya-scribe-audio
      MINIO_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  minio-data:
  qdrant-data:
