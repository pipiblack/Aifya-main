services:
  # =============================================================================
  # Edge — Traefik reverse proxy with Let's Encrypt
  # =============================================================================

  traefik:
    image: traefik:v3.1
    container_name: aifya-traefik
    profiles: ["prod"]   # only starts when running `docker compose --profile prod up`
    restart: unless-stopped
    command:
      # Entry points
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Docker provider — discover services by label
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=aifya_default"
      # Let's Encrypt
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=admin@aifyahealth.co.ke"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # Logs + dashboard (dashboard on :8081 behind basic auth in prod — disable for now)
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - default

  # =============================================================================
  # Infrastructure
  # =============================================================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aifya-postgres
    environment:
      POSTGRES_DB: aifya
      POSTGRES_USER: aifya_user
      POSTGRES_PASSWORD: change_me_in_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifya_user -d aifya"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aifya-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: aifya-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:latest
    container_name: aifya-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aifya-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: aifya-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aifya
      KC_DB_USERNAME: aifya_user
      KC_DB_PASSWORD: change_me_in_production
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/aifya-realm.json:/opt/keycloak/data/import/aifya-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # =============================================================================
  # Application Services
  # =============================================================================

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: aifya-api-gateway
    environment:
      DATABASE_URL: postgresql+asyncpg://aifya_user:change_me_in_production@postgres:5432/aifya
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      AI_SERVICE_URL: http://ai-service:8010
      VLLM_MEDGEMMA_27B_URL: http://medgemma:8004/v1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api-gateway:/app
    labels:
      # Traefik routing — only active when running with --profile prod
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.aifyahealth.co.ke`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: aifya-web
    environment:
      NEXT_PUBLIC_API_URL: https://api.aifyahealth.co.ke/api/v1
      NEXT_PUBLIC_KNOWLEDGE_API_URL: https://api.aifyahealth.co.ke/knowledge/api/v1
      NEXT_PUBLIC_SCRIBE_API_URL: https://api.aifyahealth.co.ke/scribe
      NEXT_PUBLIC_WS_URL: wss://api.aifyahealth.co.ke/ws
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    labels:
      - "traefik.enable=true"
      # Apex + www both → web frontend
      - "traefik.http.routers.web.rule=Host(`aifyahealth.co.ke`) || Host(`www.aifyahealth.co.ke`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: aifya-billing
    environment:
      DATABASE_URL: postgres://aifya_user:change_me_in_production@postgres:5432/aifya
      PORT: "8020"
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy

  knowledge-service:
    build:
      context: ./services/ai-service/knowledge
      dockerfile: Dockerfile
    container_name: aifya-knowledge
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://aifya_user:change_me_in_production@postgres:5432/aifya
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: aifya
      QDRANT_ENDPOINT: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_KNOWLEDGE_BUCKET: aifya-knowledge
      MINIO_SECURE: "false"
      VLLM_BASE_URL: http://localhost:8002/v1
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8025:8025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  knowledge-worker:
    build:
      context: ./services/ai-service/knowledge
      dockerfile: Dockerfile
    container_name: aifya-knowledge-worker
    command: celery -A app.tasks.celery_app worker -l info -Q knowledge -c 2
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://aifya_user:change_me_in_production@postgres:5432/aifya
      QDRANT_ENDPOINT: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_KNOWLEDGE_BUCKET: aifya-knowledge
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  # =============================================================================
  # ScribeAI — Ambient Clinical Documentation
  # =============================================================================

  scribe-service:
    build:
      context: ./services/ai-service/scribe/backend
      dockerfile: Dockerfile
    container_name: aifya-scribe
    ports:
      - "8005:8005"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://aifya_user:change_me_in_production@postgres:5432/aifya
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_AUDIO_BUCKET: aifya-scribe-audio
      MINIO_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # =============================================================================
  # Observability (optional, comment out if not needed for dev)
  # =============================================================================

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: aifya-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: aifya-grafana
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pgdata:
  minio-data:
  qdrant-data:
  traefik-letsencrypt:
