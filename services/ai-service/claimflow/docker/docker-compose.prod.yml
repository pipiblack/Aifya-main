name: claimflow-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: claimflow
      POSTGRES_USER: claimflow
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD required}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U claimflow -d claimflow" ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  api:
    image: "${DOCKER_REGISTRY:-claimflow}/api:${VERSION:-latest}"
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # ports:
    #   - "${API_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://claimflow:${DB_PASSWORD}@postgres:5432/claimflow"
      STORAGE_PATH: /data
      ML_SERVICE_URL: http://ml:8000
      RULEPACK_DIR: /data/rulepacks
      KEY_PATH: /etc/claimflow/keys
      LOG_LEVEL: info
      REQUIRE_MFA: "false"
      LICENSE_TOKEN: "${LICENSE_TOKEN}"
    volumes:
      - app_data:/data
      - keys:/etc/claimflow/keys:ro
      - rulepacks:/data/rulepacks:ro
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

  web:
    image: "${DOCKER_REGISTRY:-claimflow}/web:${VERSION:-latest}"
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:?PUBLIC_API_URL required}"
        NEXT_PUBLIC_FIREBASE_API_KEY: "${FIREBASE_API_KEY}"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "${FIREBASE_AUTH_DOMAIN}"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "${FIREBASE_STORAGE_BUCKET}"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "${FIREBASE_MESSAGING_SENDER_ID}"
        NEXT_PUBLIC_FIREBASE_APP_ID: "${FIREBASE_APP_ID}"
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "${FIREBASE_MEASUREMENT_ID}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # ports:
    #   - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  ml:
    image: "${DOCKER_REGISTRY:-claimflow}/ml:${VERSION:-latest}"
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml
    restart: unless-stopped
    environment:
      STORAGE_PATH: /data
      OCR_ENGINE: "tesseract+paddleocr"
      CONF_THRESHOLD_HIGH: "${CONF_HIGH:-0.85}"
      CONF_THRESHOLD_LOW: "${CONF_LOW:-0.60}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - app_data:/data
      - models:/data/models:ro
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "10095:80"
    volumes:
      - ./nginx/claimflow.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment after setting up Certbot
      # - certs:/etc/letsencrypt
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

volumes:
  pg_data:
  app_data:
  keys:
  rulepacks:
  models: # certs:
